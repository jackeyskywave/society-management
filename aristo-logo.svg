<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <rect width="160" height="160" fill="#f4f3ef"/>
  <!-- Gold Mandala Crown / Crest -->
  <g fill="none" stroke="#d4af37" stroke-width="2">
    <circle cx="80" cy="50" r="28" stroke-width="3"/>
    <circle cx="80" cy="50" r="33" stroke-dasharray="2,3"/>
    <!-- Crown accents -->
    <path d="M 80,14 L 84,20 L 76,20 Z" fill="#d4af37"/>
    <path d="M 70,18 L 74,23 L 66,23 Z" fill="#d4af37"/>
    <path d="M 90,18 L 94,23 L 86,23 Z" fill="#d4af37"/>
  </g>
  <!-- Stylized A Symbol -->
  <path d="M 80 32 L 67 63 L 73 63 L 76 56 L 84 56 L 87 63 L 93 63 Z M 80 44 L 82 51 L 78 51 Z" fill="#c59b27"/>
  <!-- Pillar stem -->
  <rect x="78" y="78" width="4" height="18" fill="#d4af37"/>
  <!-- ARISTO Text -->
  <text x="80" y="112" font-family="'Times New Roman', Times, serif" font-size="22" font-weight="bold" fill="#1c1c1c" text-anchor="middle" letter-spacing="1">ARISTO</text>
  <!-- BLISS Text with Flourish -->
  <path d="M 35 127 Q 45 124 55 127" fill="none" stroke="#c59b27" stroke-width="1.5"/>
  <text x="80" y="132" font-family="'Times New Roman', Times, serif" font-size="16" font-weight="bold" fill="#c59b27" text-anchor="middle" letter-spacing="2">BLISS</text>
  <path d="M 105 127 Q 115 124 125 127" fill="none" stroke="#c59b27" stroke-width="1.5"/>
</svg>
