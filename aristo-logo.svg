<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 270" width="300" height="270">
  <rect width="300" height="270" fill="#ffffff"/>
  
  <!-- Outer Gold Mandala Circle Frame -->
  <g fill="none" stroke="#c59b27" stroke-width="2.5">
    <circle cx="150" cy="72" r="42"/>
    <circle cx="150" cy="72" r="37" stroke-width="1.5" stroke-dasharray="3,3"/>
    
    <!-- Crown at Top of Mandala -->
    <path d="M 150 18 L 157 28 L 143 28 Z" fill="#c59b27"/>
    <path d="M 136 24 L 142 32 L 130 32 Z" fill="#c59b27"/>
    <path d="M 164 24 L 170 32 L 158 32 Z" fill="#c59b27"/>
    
    <!-- Bottom Flourish under Mandala -->
    <path d="M 150 120 L 154 126 L 146 126 Z" fill="#c59b27"/>
  </g>
  
  <!-- Stylized Monogram A inside Circle -->
  <path d="M 150 45 L 132 90 L 141 90 L 145 80 L 155 80 L 159 90 L 168 90 Z M 150 62 L 153 72 L 147 72 Z" fill="#c59b27"/>
  
  <!-- ARISTO with Gold Pillar 'I' -->
  <!-- AR -->
  <text x="50" y="162" font-family="'Times New Roman', Georgia, serif" font-size="44" font-weight="bold" fill="#000000">AR</text>
  
  <!-- Pillar I -->
  <g transform="translate(122, 126)">
    <rect x="0" y="0" width="16" height="4" fill="#c59b27"/>
    <rect x="3" y="4" width="10" height="2" fill="#c59b27"/>
    <rect x="5" y="6" width="6" height="24" fill="#c59b27"/>
    <rect x="3" y="30" width="10" height="2" fill="#c59b27"/>
    <rect x="0" y="32" width="16" height="4" fill="#c59b27"/>
  </g>
  
  <!-- STO -->
  <text x="145" y="162" font-family="'Times New Roman', Georgia, serif" font-size="44" font-weight="bold" fill="#000000">STO</text>
  
  <!-- BLISS with Side Flourishes -->
  <path d="M 40 196 C 55 190 65 202 80 196" fill="none" stroke="#c59b27" stroke-width="2"/>
  <circle cx="38" cy="196" r="2.5" fill="#c59b27"/>
  
  <text x="150" y="206" font-family="'Times New Roman', Georgia, serif" font-size="34" font-weight="bold" fill="#c59b27" text-anchor="middle" letter-spacing="4">BLISS</text>
  
  <path d="M 220 196 C 235 202 245 190 260 196" fill="none" stroke="#c59b27" stroke-width="2"/>
  <circle cx="262" cy="196" r="2.5" fill="#c59b27"/>
  
  <!-- SOCIETY Subtitle -->
  <text x="150" y="244" font-family="'Times New Roman', Georgia, serif" font-size="18" font-weight="normal" fill="#000000" text-anchor="middle" letter-spacing="9">SOCIETY</text>
</svg>
